version: '3.8'

services:
  gcli2api:
    build: .
    container_name: gcli2api
    restart: unless-stopped
    ports:
      - '7861:7861'
      - '8085:8085'
    environment:
      - PASSWORD=${PASSWORD:-pwd}
      - PORT=${PORT:-7861}
      - HOST=${HOST:-0.0.0.0}
    volumes:
      - ./data/creds:/app/creds
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import sys, urllib.request, os; port = os.environ.get('PORT', '7861'); req = urllib.request.Request(f'http://localhost:{port}/v1/models', headers={'Authorization': 'Bearer ' + os.environ.get('PASSWORD', 'password')}); sys.exit(0 if urllib.request.urlopen(req, timeout=5).getcode() == 200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
